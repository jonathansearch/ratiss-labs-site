sections:
  question: >
    La croissance de vorticité jusqu'au blow-up est-elle reproductible à
    l'identique, run après run, sur une machine modeste ?
  reference_work: "Travail original RATISS ; pas de reproduction externe."
  method: >
    SPH 3D, traceurs lagrangiens, échantillonnage à chaque pas de temps ;
    paramètres figés AVANT exécution ; configuration complète embarquée dans
    chaque JSON de campagne.
  results:
    - "Blow-up : Om_max = 5654.1668, reproduit avec un écart point par point de 0.0000."
    - "Quatre campagnes publiées (dernier commit 5e736e0) ; révision 4 scellée (8557fc6)."
  negative:
    - "Témoins V3 non refaits : les critères de la campagne dipoles-v3 attendent la signature du chef."
  controls: >
    Critères scellés par le chef avant tout run ; rien sur GitHub sans ordre ;
    empreintes SHA-256 des sorties.
  limitations: >
    SPH : résolution limitée par le nombre de particules ; le blow-up numérique
    n'établit pas un blow-up analytique de Navier–Stokes.
