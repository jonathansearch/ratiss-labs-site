abstract: >
  Étude Navier–Stokes par SPH 3D avec traceurs : le blow-up atteint
  Om_max = 5654.1668 et se reproduit bit à bit, écart point par point 0.0000.
  Quatre campagnes publiées ; révision 4 scellée (8557fc6). Le commissaire NAVIER
  impose : critères scellés par le chef avant tout run, échantillonnage à chaque
  pas, configuration explicite dans chaque JSON.
