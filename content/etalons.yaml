keywords: [étalons, percolation, ising, trois corps, empilements, résultats négatifs]
references: []
sections:
  question: >
    Une batterie d'étalons à critères scellés peut-elle servir de référence
    reproductible pour juger les futurs moteurs de calcul RATISS ?
  reference_work: "Cas tests classiques de physique statistique et de mécanique céleste."
  method: >
    Critères figés AVANT exécution dans PROTOCOLE.md ; exécutions ensuite ;
    tout écart publié, y compris les échecs.
  results:
    - "Score 11/16 → 14/16 après corrections déclarées ; sceau 23/23."
    - "p_c = 0,0006 ; d_f = 1,8934 ± 0,0192 ; T_c = 2,2613 ; γ/ν = 1,7540."
    - "Conservation : ΔE/E = 1,21e−15 ; réseau FCC = 4,44e−16."
    - "Burrau λ = 0,55402 stable à 0,78 %."
  negative:
    - "E01-P2 : hypothèse « pic de densité de trous à p_c » INVALIDE — h(p) est monotone. Rouge assumé."
    - "E04-P4 : compresseur 3D sous-estimé (0,61403 vs 0,64 ± 0,020) — taille finie + état partiellement cristallin (ψ₆ = 0,827 / 0,935). Rouge assumé."
    - "RK4 à pas fixe FALSIFIÉ comme étalon : λ = +44 124, du bruit."
  controls: "Critères scellés avant run ; figures matplotlib sans emoji ; empreintes du sceau 23/23."
  limitations: "Tailles finies ; deux rouges conservés volontairement comme bornes connues du moteur."
sources:
