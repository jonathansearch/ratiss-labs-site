id: ratiss-etalons-004
title: "RATISS-ETALONS : quatre étalons calculatoires à critères scellés avant exécution"
slug: etalons
domain: [fundamental, statistical_physics]
type: [benchmark, negative_results]
status: published
authors: ["Jonathan Evina"]
date: 2026-09-26
version: "v1"
temp: lime
abstract: >
  Quatre étalons (percolation, Ising 2D, problème à trois corps, empilements
  compacts) avec critères figés AVANT exécution (PROTOCOLE.md). Score 11/16 puis
  14/16 après corrections déclarées. Deux rouges ASSUMÉS et diagnostiqués :
  E01-P2, dont l'hypothèse « pic de densité de trous à p_c » est INVALIDE (h(p)
  monotone), et E04-P4, où le compresseur 3D sous-estime (0,61403 vs 0,64 ± 0,020)
  en raison d'une taille finie et d'un état partiellement cristallin
  (ψ₆ = 0,827 / 0,935). Chiffres clés : p_c = 0,0006 ; d_f = 1,8934 ± 0,0192 ;
  T_c = 2,2613 ; γ/ν = 1,7540 ; ΔE/E = 1,21e−15 ; FCC = 4,44e−16 ;
  Burrau λ = 0,55402 stable à 0,78 %.
