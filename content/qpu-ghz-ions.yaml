status: published
authors: ["Jonathan Evina"]
date: 2026-09-30
version: "v1"
temp: violet
abstract: >
  Quatorze charges exécutées le 29/09/2026 sur trois QPU réels via Open Quantum
  (Rigetti Cepheus-1-108Q, IQM Garnet, AQT IBEX Q1 ions piégés). Pièce maîtresse :
  GHZ-4 ions piégés df23deac = 97,27 % ((497 + 499) / 1024). Trilogie GHZ-4 :
  ions 97,3 > Garnet 94,6 > Cepheus 79,3. Bell 99,61 % et GHZ-7 90,04 % sur IBEX.
  Chat-12 à 66,0 %. Pente ions compatible avec −1,9 pt/qubit, décroissance qui
  s'accélère. Coûts réels mesurés : 1 / 2 / 15 Spark par 1024 tirs.
