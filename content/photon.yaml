id: ratiss-photon-001
title: "Reproduction computationnelle d'une expérience photonique multi-chemins"
slug: photon
domain: [quantum_physics, photonics]
type: [reproduction, computational_experiment]
status: published
authors: ["Jonathan Evina"]
date: 2026-09-27
version: "v2"
temp: turquoise
abstract: >
  Reproduction in-silico, par un moteur paraxial v2 reprenant l'équation même du
  papier de référence, de l'expérience photonique multi-chemins de Wen et al.
  Sur l'expérience E-CANTON : 8 396 800 chemins à module égal, fidélité 95,92 %
  (2 plans), 95,96 % (3 plans), 96,77 % (action naïve) ; corrélation d'intensité
  97,08–97,10 % ; contrôle croisé 96,06 % ; phase de l'écran 5,4°. La fenêtre de
  Canton (95–98,5 %) est atteinte. Calcul uniquement : zéro QPU.
repository: "https://github.com/jonathansearch/RATISS-PHOTON"
site: "https://jonathansearch.github.io/RATISS-PHOTON"
